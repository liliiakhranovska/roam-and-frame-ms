spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
customer.url=${CUSTOMER_URL:http://localhost:8085}
customer.timeout=${CUSTOMER_TIMEOUT:2s}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.public-key=${JWT_PUBLIC_KEY}
spring.cloud.gateway.server.webmvc.routes[0].id=catalog
spring.cloud.gateway.server.webmvc.routes[0].uri=${CATALOG_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webmvc.routes[1].id=customer
spring.cloud.gateway.server.webmvc.routes[1].uri=${CUSTOMER_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/customer/**
spring.cloud.gateway.server.webmvc.routes[2].id=cart
spring.cloud.gateway.server.webmvc.routes[2].uri=${CART_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/cart/**