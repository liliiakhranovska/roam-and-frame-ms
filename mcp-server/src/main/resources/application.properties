spring.application.name=mcp-server
server.port=${SERVER_PORT:8090}
management.endpoints.web.exposure.include=health,info

spring.ai.mcp.server.name=roam-and-frame
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

platform.catalog-url=${CATALOG_URL:http://catalog-service}
platform.orders-url=${ORDERS_URL:http://order-service}
platform.cart-url=${CART_URL:http://cart-service}
platform.customer-url=${CUSTOMER_URL:http://customer-service}
platform.timeout=${PLATFORM_TIMEOUT:3s}
platform.max-items=${PLATFORM_MAX_ITEMS:20}

circuitbreaker.window-size=${CB_WINDOW_SIZE:10}
circuitbreaker.minimum-calls=${CB_MINIMUM_CALLS:5}
circuitbreaker.failure-rate=${CB_FAILURE_RATE:50}
circuitbreaker.open-duration=${CB_OPEN_DURATION:30s}
circuitbreaker.trial-calls=${CB_TRIAL_CALLS:3}

app.jwt.public-key=${JWT_PUBLIC_KEY}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}