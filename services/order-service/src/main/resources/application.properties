spring.application.name=order-service
server.port=${SERVER_PORT:8088}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USER:orders_svc}
spring.datasource.password=${DB_PASSWORD:orders}
spring.jpa.hibernate.ddl-auto=validate
shipping.url=${SHIPPING_URL:http://shipping-service}
shipping.timeout=${SHIPPING_TIMEOUT:2s}
app.jwt.public-key=${JWT_PUBLIC_KEY}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}