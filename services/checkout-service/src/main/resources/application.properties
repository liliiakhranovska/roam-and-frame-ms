spring.application.name=checkout-service
server.port=${SERVER_PORT:8089}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkout}
spring.datasource.username=${DB_USER:checkout_svc}
spring.datasource.password=${DB_PASSWORD:checkout}
spring.jpa.hibernate.ddl-auto=validate
checkout.stale-after=${CHECKOUT_STALE_AFTER:60s}
checkout.recovery-interval=${CHECKOUT_RECOVERY_INTERVAL:30s}
customer.url=${CUSTOMER_URL:http://localhost:8085}
customer.timeout=${CUSTOMER_TIMEOUT:2s}
cart.url=${CART_URL:http://localhost:8086}
cart.timeout=${CART_TIMEOUT:2s}
inventory.url=${INVENTORY_URL:http://localhost:8082}
inventory.timeout=${INVENTORY_TIMEOUT:2s}
payment.url=${PAYMENT_URL:http://localhost:8083}
payment.timeout=${PAYMENT_TIMEOUT:5s}
order.url=${ORDER_URL:http://localhost:8088}
order.timeout=${ORDER_TIMEOUT:2s}
shipping.url=${SHIPPING_URL:http://localhost:8087}
shipping.timeout=${SHIPPING_TIMEOUT:5s}
notification.url=${NOTIFICATION_URL:http://localhost:8081}
notification.timeout=${NOTIFICATION_TIMEOUT:2s}
circuitbreaker.window-size=${CB_WINDOW_SIZE:10}
circuitbreaker.minimum-calls=${CB_MINIMUM_CALLS:5}
circuitbreaker.failure-rate=${CB_FAILURE_RATE:50}
circuitbreaker.open-duration=${CB_OPEN_DURATION:30s}
circuitbreaker.trial-calls=${CB_TRIAL_CALLS:3}
app.jwt.public-key=${JWT_PUBLIC_KEY}