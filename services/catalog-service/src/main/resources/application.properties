spring.application.name=catalog-service
server.port=${SERVER_PORT:8084}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${DB_USER:catalog_svc}
spring.datasource.password=${DB_PASSWORD:catalog}
spring.jpa.hibernate.ddl-auto=validate
inventory.url=${INVENTORY_URL:http://localhost:8082}
inventory.timeout=${INVENTORY_TIMEOUT:2s}