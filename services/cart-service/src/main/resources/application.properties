spring.application.name=cart-service
server.port=${SERVER_PORT:8086}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cart}
spring.datasource.username=${DB_USER:cart_svc}
spring.datasource.password=${DB_PASSWORD:cart}
spring.jpa.hibernate.ddl-auto=validate
catalog.url=${CATALOG_URL:http://localhost:8084}
catalog.timeout=${CATALOG_TIMEOUT:2s}
app.jwt.public-key=${JWT_PUBLIC_KEY}